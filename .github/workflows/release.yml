name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apks:
    name: Build release APKs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        run: |
          mkdir -p /home/runner/android-sdk/cmdline-tools
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools /home/runner/android-sdk/cmdline-tools/latest
          export ANDROID_HOME=/home/runner/android-sdk
          export ANDROID_SDK_ROOT=/home/runner/android-sdk
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.2.12479018" "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1 || true
          echo "ANDROID_HOME=/home/runner/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/home/runner/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/home/runner/android-sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=/home/runner/android-sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        run: cargo install --locked cargo-apk

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v -keystore /home/runner/release.keystore \
            -alias oxidoc -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass oxidoc -keypass oxidoc \
            -dname "CN=OxiDoc Viewer, OU=Dev, O=OxiDoc Viewer, L=City, ST=State, C=ES" > /dev/null

      - name: Build arm64 release APK
        run: |
          cargo apk build --lib --release --target aarch64-linux-android
          cp target/release/apk/OxiDocViewer.apk "${{ github.workspace }}/OxiDocViewer-arm64-release.apk"

      - name: Build armv7 release APK
        run: |
          cargo apk build --lib --release --target armv7-linux-androideabi
          cp target/release/apk/OxiDocViewer.apk "${{ github.workspace }}/OxiDocViewer-armeabi-v7a-release.apk"

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OxiDocViewer-arm64-release.apk
            OxiDocViewer-armeabi-v7a-release.apk
          fail_on_unmatched_files: true
