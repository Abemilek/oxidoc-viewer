[package]
name = "oxidoc-viewer"
version = "0.1.0"
edition = "2021"
description = "A lightweight, native document viewer for Android, written entirely in Rust with egui, for Word, OpenDocument and plain-text files"
license = "MIT"

[lib]
name = "oxidoc_viewer"
# cdylib => liboxidoc_viewer.so loaded by NativeActivity on Android
# lib    => host-side parser tests
crate-type = ["cdylib", "lib"]

[dependencies]
# Pure-Rust ZIP (no bzip2/zstd, which pull in C code). Deflate only.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Pure-Rust image decoders
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }

# ---------- Android ----------
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
# AndroidApp type expected by eframe::NativeOptions (same version used by winit)
android-activity = "0.6"
# Only JNI usage: open the "All files access" settings screen
jni = "0.21"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# ---------- APK packaging with cargo-apk ----------
[package.metadata.android]
package = "dev.oxidoc.viewer"
apk_name = "OxiDocViewer"
build_targets = ["aarch64-linux-android"]
# Icon resources (adaptive icon + legacy PNGs)
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 30
target_sdk_version = 34

[package.metadata.android.application]
label = "OxiDoc Viewer"
icon = "@mipmap/ic_launcher"
# Dark system theme: white status-bar icons and a dark window background, whatever the
# system theme is (the app itself is always pure black).
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
# One instance only: a second NativeActivity cannot run in the same process.
launch_mode = "singleTask"

# "Open with": offered for Word, OpenDocument and text files from file managers and other apps.
# Content is read through the ContentResolver, so no storage permission is needed for it.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]
data = [
    { mime_type = "application/vnd.openxmlformats-officedocument.wordprocessingml.document" },
    { mime_type = "application/vnd.openxmlformats-officedocument.wordprocessingml.template" },
    { mime_type = "application/vnd.ms-word.document.macroEnabled.12" },
    { mime_type = "application/vnd.oasis.opendocument.text" },
    { mime_type = "application/vnd.oasis.opendocument.text-template" },
    { mime_type = "text/plain" },
    { mime_type = "text/markdown" },
]

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"
