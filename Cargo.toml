[package]
name = "visor-docx"
version = "0.1.0"
edition = "2021"
description = "Visor de documentos Word (.docx), OpenDocument (.odt) y texto, escrito 100% en Rust (egui) para Android y escritorio"
license = "MIT"

[lib]
name = "visor_docx"
# cdylib => libvisor_docx.so que carga NativeActivity en Android
# lib    => permite usarlo también desde el binario de escritorio
crate-type = ["lib", "cdylib"]

[[bin]]
name = "visor-docx-desktop"
path = "src/main.rs"

[dependencies]
# ZIP puro Rust (sin bzip2/zstd, que traen código C). Solo deflate.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Decodificadores de imagen puro Rust
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }

# ---------- Escritorio (para probar rápido en tu laptop) ----------
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

# ---------- Android ----------
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
# Tipo AndroidApp que espera eframe::NativeOptions (misma versión que usa winit)
android-activity = "0.6"
# Único uso de JNI: abrir la pantalla de ajustes "Acceso a todos los archivos"
jni = "0.21"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# ---------- Empaquetado APK con cargo-apk ----------
[package.metadata.android]
package = "dev.visordocx.rs"
apk_name = "VisorDocx"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 30
target_sdk_version = 34

[package.metadata.android.application]
label = "Visor DOCX"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"
